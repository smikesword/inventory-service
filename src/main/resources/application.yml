spring:
  application:
    name: inventory-service

  datasource:
    username: user
    password: password
    url: jdbc:postgresql://localhost:5432/yodb_inventory
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 5

  management:
    endpoints:
      enabled-by-default: false
      web:
        exposure:
          include: health
    endpoint:
      health:
        probes: enabled
